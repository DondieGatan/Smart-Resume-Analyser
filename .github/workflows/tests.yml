name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_CI_PASSWORD || 'CiPytestPassw0rd!' }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # scripts/*.py do `from config import Config`; running them as
      # `python scripts/foo.py` puts scripts/ on sys.path, not the repo
      # root, so without this the import fails with ModuleNotFoundError.
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql://postgres:${{ secrets.POSTGRES_CI_PASSWORD || 'CiPytestPassw0rd!' }}@localhost:5432/postgres
      DB_SCHEMA: resume_analyser_ci
      SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Wait for Postgres to accept connections
        run: python scripts/wait_for_sql.py

      - name: Create schema (resumes/skills/education/experience/analysis_results)
        run: python scripts/run_sql_file.py setup_db.sql

      - name: Create users table
        run: python -c "from models import init_users_table; init_users_table()"

      - name: Run schema migrations (adds resumes.user_id, recreates the dashboard view)
        run: python -c "from models import ensure_schema_migrations; ensure_schema_migrations()"

      - name: Run tests
        run: pytest -v
